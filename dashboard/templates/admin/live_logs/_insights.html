<div id="live-logs-insights" class="grid grid-cols-1 md:grid-cols-4 gap-4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
  <div class="p-4 rounded-xl flex flex-col justify-between shadow-sm border bg-base-100 text-base-700 border-base-200 dark:bg-base-800 dark:text-base-300 dark:border-base-700">
    <p class="text-[11px] font-mono tracking-widest">ERROR RATE</p>
    <p class="text-xl font-bold" data-insight-error-rate>0%</p>
    <p class="text-xs">4XX+5XX / Total</p>
  </div>
  <div class="p-4 rounded-xl flex flex-col justify-between shadow-sm border bg-base-100 text-base-700 border-base-200 dark:bg-base-800 dark:text-base-300 dark:border-base-700">
    <p class="text-[11px] font-mono tracking-widest">TOP ERROR PATH</p>
    <p class="text-sm font-mono font-bold truncate" data-insight-top-path>—</p>
    <p class="text-xs">most frequent 4XX/5XX</p>
  </div>
  <div class="p-4 rounded-xl flex flex-col justify-between shadow-sm border bg-base-100 text-base-700 border-base-200 dark:bg-base-800 dark:text-base-300 dark:border-base-700">
    <p class="text-[11px] font-mono tracking-widest">BUSIEST METHOD</p>
    <p class="text-sm font-mono font-bold" data-insight-method>—</p>
    <p class="text-xs" data-insight-avg>avg — ms</p>
  </div>
  <div class="p-4 rounded-xl flex flex-col justify-between shadow-sm border bg-base-100 text-base-700 border-base-200 dark:bg-base-800 dark:text-base-300 dark:border-base-700">
    <p class="text-[11px] font-mono tracking-widest">SUCCESS RATE</p>
    <p class="text-xl font-bold" data-insight-success-rate>0%</p>
    <p class="text-xs">2XX / Total</p>
  </div>
</div>
