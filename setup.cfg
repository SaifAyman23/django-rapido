[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501, F401, E402, W292, E722, F821, F403, F405
exclude = migrations, venv, .venv, .git, __pycache__, staticfiles, media, node_modules, tests
per-file-ignores =
    __init__.py:F401
    common/decorators.py:F821
    common/admin.py:E722

[mypy]
python_version = 3.13
warn_return_any = true
ignore_missing_imports = true
exclude = (?x)(^migrations/|^venv/|^.venv/|^node_modules/)
