# ============================================================
# Django Rapido — Docker Compose (development base)
#
# This file is the BASE stack. It is used two ways:
#
#   DEV  (local settings, runserver hot-reload, host ports open):
#     docker compose up -d --build
#
#   PROD  (gunicorn, TLS, production settings) — layered with the
#   production override, which resets dev behavior and pins
#   DJANGO_ENVIRONMENT=production:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Credentials are read from .env (never committed).
# REUSE: This compose is generic — replace ${DOMAIN} in prod override.
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  project_network:
    driver: bridge

services:
  # ===========================
  # PostgreSQL Database
  # ===========================
  db:
    image: pgvector/pgvector:pg17
    container_name: project_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-project_db}
      POSTGRES_USER: ${DB_USER:-project_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432" # REUSE: remove in production (prod override resets)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-project_user} -d ${DB_NAME:-project_db}",
        ]
      interval: 5s
      retries: 10
      start_period: 5s
    networks:
      - project_network

  # ===========================
  # Redis Cache & Message Broker
  # ===========================
  redis:
    image: redis:7-alpine
    container_name: project_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_password}"
    ports:
      - "6379:6379" # REUSE: remove in production
    volumes:
      - redis_data:/data
    healthcheck:
      # REUSE: -a auth is required when requirepass is set
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "--no-auth-warning", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - project_network

  # ===========================
  # Django Web Application
  # ===========================
  web:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_web
    restart: unless-stopped
    # Dev: runserver with hot reload. Production override swaps for gunicorn.
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    environment:
      - CONTAINER_ROLE=web
      - DJANGO_ENVIRONMENT=${DJANGO_ENVIRONMENT:-local}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      retries: 3
      start_period: 15s

  # ===========================
  # Celery Worker
  # ===========================
  celery_worker:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_celery_worker
    restart: unless-stopped
    # Dev: autoreload. Production override swaps command.
    command: celery -A project worker --loglevel=info --autoscale=10,4
    volumes:
      - .:/app
    environment:
      - CONTAINER_ROLE=celery_worker
      - DJANGO_ENVIRONMENT=${DJANGO_ENVIRONMENT:-local}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project_network

  # ===========================
  # Celery Beat (Task Scheduler)
  # ===========================
  celery_beat:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_celery_beat
    restart: unless-stopped
    command: celery -A project beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - CONTAINER_ROLE=celery_beat
      - DJANGO_ENVIRONMENT=${DJANGO_ENVIRONMENT:-local}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project_network

  # ===========================
  # Celery Flower (Monitoring Dashboard)
  # ===========================
  flower:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_flower
    restart: unless-stopped
    command: celery -A project flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    ports:
      - "5555:5555" # REUSE: prod override resets — proxy via nginx instead
    environment:
      - CONTAINER_ROLE=flower
      - DJANGO_ENVIRONMENT=${DJANGO_ENVIRONMENT:-local}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - project_network

  # ===========================
  # Nginx Reverse Proxy
  # ===========================
  nginx:
    image: nginx:alpine
    container_name: project_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - project_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health/",
        ]
      interval: 30s
      retries: 3
